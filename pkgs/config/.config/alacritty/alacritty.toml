[font]
normal = { family = "Dank Mono", style = "Regular" }
bold = { family = "Dank Mono", style = "Bold" }
italic = { family = "Dank Mono", style = "Italic" }

size = 18

# ===== surrealism · Magritte night 配色(天空之窗:暗底,Hyprland window_rule 讓夜空透出) =====
[window]
padding = { x = 10, y = 8 }
dynamic_padding = false  # 內容左上對齊,改字級時零頭固定丟到右下,不要置中上下跳
opacity = 1.0            # 透明度交給 Hyprland window_rule(0.85)→ 夜空穿透

[colors.primary]
background = "#141c28"   # night 深藍底(0.85 半透 → 夜空透出)
foreground = "#e6ecf3"   # cloud 雲白前景

[colors.cursor]
text   = "#141c28"
cursor = "#e6b24e"       # lamp 街燈金游標

[colors.selection]
background = "#3d5a72"    # sky-dusk
text       = "#f2f5f7"

# Magritte 夜空色組(夠亮,在深藍底上可讀;唯一暖色=lamp 金)
[colors.normal]
black   = "#20293a"
red     = "#b5645a"      # 赭紅/肉色
green   = "#6f9160"      # 蘋果綠(muted)
yellow  = "#e6b24e"      # 街燈金
blue    = "#6f9fca"      # 天藍
magenta = "#8f7194"      # 暮紫
cyan    = "#6fa6b2"      # 淡天青
white   = "#c4cdd8"      # 雲灰

[colors.bright]
black   = "#46536a"
red     = "#cc7f74"
green   = "#88a878"
yellow  = "#f0c268"
blue    = "#93b8da"
magenta = "#ab8fae"
cyan    = "#8dbcc7"
white   = "#f2f5f7"      # 雲白

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"
