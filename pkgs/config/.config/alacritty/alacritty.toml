[font]
normal = { family = "Dank Mono", style = "Regular" }
bold = { family = "Dank Mono", style = "Bold" }
italic = { family = "Dank Mono", style = "Italic" }

size = 18

# ===== surrealism · Magritte night 配色(天空之窗:暗底,Hyprland window_rule 讓夜空透出) =====
[window]
padding = { x = 10, y = 8 }
dynamic_padding = false  # 內容左上對齊,改字級時零頭固定丟到右下,不要置中上下跳
opacity = 0.96         # W②「畫」:實心夜空藍畫布(留一絲透讓邊緣有呼吸,非全透)

[colors.primary]
background = "#151d33"   # 夜空藍畫布:深夜靛藍(金框內的畫布)
foreground = "#eef2f9"   # cloud 亮雲白(壓在深藍夜空上高對比)

[colors.cursor]
text   = "#141c28"
cursor = "#e6b24e"       # lamp 街燈金游標

[colors.selection]
background = "#3d5a72"    # sky-dusk
text       = "#f2f5f7"

# Magritte 夜空色組 —— 背景全透版:整體提亮+加飽和,壓在深藍夜空桌布上都夠亮可讀
# (暗色會沒入夜空,故 black 也拉高;藍/紫拉亮避免跟夜空撞色;唯一暖色=lamp 金)
[colors.normal]
black   = "#54607a"      # 提亮(全透下不能太暗,否則沒入夜空)
red     = "#d47b6d"      # 赭紅/肉色(提亮)
green   = "#9fd487"      # 蘋果綠(再拉亮,別沒入夜空)
yellow  = "#eab74f"      # 街燈金
blue    = "#8fc8f2"      # 天藍(再拉亮+微偏青,跟深藍夜空拉開)
magenta = "#ad8cc4"      # 暮紫(提亮)
cyan    = "#82bfcd"      # 淡天青(提亮)
white   = "#d6dfea"      # 雲灰

[colors.bright]
black   = "#8290a8"      # ★ 註解/次要文字:大幅提亮,夜空上清楚可見
red     = "#e6968a"
green   = "#bce4a4"
yellow  = "#f6cd72"
blue    = "#b8dcf8"
magenta = "#c6aada"
cyan    = "#a0d3df"
white   = "#f5f8fc"      # 雲白

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"
